[project]
name = "decision_maker"
version = "0.1.0"
description = "decision_maker using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.108.0,<1.0.0"
]

[project.scripts]
decision_maker = "decision_maker.main:run"
run_crew = "decision_maker.main:run"
train = "decision_maker.main:train"
replay = "decision_maker.main:replay"
test = "decision_maker.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
